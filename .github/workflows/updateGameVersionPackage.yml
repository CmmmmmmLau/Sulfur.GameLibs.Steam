name: Update GameLibs for Version

on:
  workflow_dispatch:
    inputs:
      game:
        description: Name of game folder in `Games` directory
        required: true
        type: string
      buildId:
        description: Steam build ID
        required: true
        type: number

  workflow_call:
    inputs:
      game:
        required: true
        type: string
      buildId:
        required: true
        type: number

  push:
    branches:
      - main
    paths:
      - "Games/*/versions/*.json"

jobs:
  detect-versions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect added or changed game versions
        id: detect
        shell: bash
        run: |
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'Games/*/versions/*.json' || true)

          json='[]'

          for file in $files; do
            if [ ! -f "$file" ]; then
              continue
            fi

            game=$(echo "$file" | cut -d'/' -f2)
            buildId=$(jq -r '.buildId' "$file")

            if [ "$buildId" = "null" ] || [ -z "$buildId" ]; then
              echo "Skipping $file because buildId is missing"
              continue
            fi

            json=$(echo "$json" | jq --arg game "$game" --argjson buildId "$buildId" \
              '. + [{"game": $game, "buildId": $buildId}]')
          done

          matrix=$(echo "$json" | jq -c '{include: .}')
          count=$(echo "$json" | jq 'length')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  update-version:
    needs: detect-versions
    if: |
      github.event_name != 'push' ||
      needs.detect-versions.outputs.has_changes == 'true'

    name: Update GameLibs package
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ github.event_name == 'push' && fromJson(needs.detect-versions.outputs.matrix) || fromJson(format('{{"include":[{{"game":"{0}","buildId":{1}}}]}}', inputs.game, inputs.buildId)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Setup SteamCMD
        uses: Lordfirespeed/setup-steamcmd@v2

      - name: Authenticate SteamCMD
        uses: Lordfirespeed/auth-steamcmd@v1
        with:
          steam_config_vdf: ${{ secrets.steam_config_vdf }}
          steam_username: ${{ secrets.steam_username }}

      - name: Build and push NuGet package
        run: |
          ./build.sh \
            --target PushNuGetPackages \
            --game ${{ matrix.game }} \
            --build ${{ matrix.buildId }} \
            --steam-username ${{ secrets.steam_username }} \
            --nuget-api-key ${{ secrets.nuget_api_key }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-build-${{ matrix.buildId }}
          path: "Games/*/nupkgs/*.nupkg"
