
name: Update GameLibs for Version

on:
  workflow_dispatch:
    inputs:
      game:
        description: Name of game folder in `Games` directory
        required: true
        type: string
      buildId:
        description: Steam build ID
        required: true
        type: number

  workflow_call:
    inputs:
      game:
        required: true
        type: string
      buildId:
        required: true
        type: number

  push:
    branches:
      - main
    paths:
      - "Games/*/versions/*.json"

jobs:
  detect-versions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect added or changed game versions
        id: detect
        shell: bash
        run: |
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'Games/*/versions/*.json' || true)

          json='[]'

          for file in $files; do
            if [ ! -f "$file" ]; then
              continue
            fi

            game=$(echo "$file" | cut -d'/' -f2)
            buildId=$(jq -r '.buildId' "$file")

            if [ "$buildId" = "null" ] || [ -z "$buildId" ]; then
              echo "Skipping $file because buildId is missing"
              continue
            fi

            json=$(echo "$json" | jq --arg game "$game" --argjson buildId "$buildId" \
              '. + [{"game": $game, "buildId": $buildId}]')
          done

          matrix=$(echo "$json" | jq -c '{include: .}')
          count=$(echo "$json" | jq 'length')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  update-version:
    needs: detect-versions

    # Allow workflow_dispatch and workflow_call even though
    # detect-versions is intentionally skipped for those events.
    if: |
      always() &&
      (
        github.event_name != 'push' ||
        needs.detect-versions.outputs.has_changes == 'true'
      )

    name: Update GameLibs package
    runs-on: ubuntu-latest

    # Required for NuGet Trusted Publishing (GitHub OIDC).
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix: ${{ github.event_name == 'push' && fromJson(needs.detect-versions.outputs.matrix) || fromJson(format('{{"include":[{{"game":"{0}","buildId":{1}}}]}}', inputs.game, inputs.buildId)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Setup SteamCMD
        uses: Lordfirespeed/setup-steamcmd@v2

      - name: Authenticate SteamCMD
        uses: Lordfirespeed/auth-steamcmd@v1
        with:
          steam_config_vdf: ${{ secrets.steam_config_vdf }}
          steam_username: ${{ secrets.steam_username }}

      # Build packages only. No NuGet API key is needed here.
      - name: Build NuGet packages
        env:
          GAME_NAME: ${{ matrix.game }}
          BUILD_ID: ${{ matrix.buildId }}
          STEAM_USERNAME: ${{ secrets.steam_username }}
        shell: bash
        run: |
          ./build.sh \
            --target MakePackages \
            --game "$GAME_NAME" \
            --build "$BUILD_ID" \
            --steam-username "$STEAM_USERNAME"

      # Save packages even if the subsequent publishing fails.
      - name: Upload Artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-build-${{ matrix.buildId }}
          path: "Games/${{ matrix.game }}/nupkgs/*.nupkg"
          if-no-files-found: warn

      # Exchange GitHub OIDC token for a temporary NuGet API key.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push all generated packages.
      - name: Push NuGet packages
        shell: bash
        env:
          GAME_NAME: ${{ matrix.game }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          : "${NUGET_API_KEY:?NuGet login did not return an API key}"

          shopt -s nullglob
          packages=( "Games/${GAME_NAME}/nupkgs/"*.nupkg )

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No NuGet packages found for ${GAME_NAME}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Pushing ${package}"

            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
